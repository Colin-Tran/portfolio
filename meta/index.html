<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meta Analysis</title>

  <link rel="stylesheet" href="../style.css">

  <script type="module" src="../global.js"></script>
  <script type="module" src="main.js"></script>

</head>

<body>
  <div class="commit-filter">
    <label>
      Show commits until:
      <input id="commit-slider" type="range" min="0" max="100" value="100" />

      <time id="commit-time"></time>

    </label>
  </div>

  
  <div id="scrolly-1">
    <div id="scatter-story">
      <p></p>
    </div>

    <div id="scatter-plot">
      <h2>Commits by time of day</h2>
      <div id="chart"></div>

      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>
    </div>
    
    <div id="file-scrolly">
    <div id="file-story"></div>

    <div id="file-viz">
      <dl id="files"></dl>
      <ul class="legend"></ul>
    </div>
  </div>

  </div>

  <div id="stats"></div>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
      <a href="" id="commit-link" target="_blank"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <!-- Add: Time, author, lines edited -->

    <dt>Time</dt>
    <dd id="commit-tooltip-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>

</body>
</html>
